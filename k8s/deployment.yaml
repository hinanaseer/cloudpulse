# CloudPulse Deployment: 2 replicas, hardened security, health probes, resource limits
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpulse
  namespace: cloudpulse
  labels:
    app.kubernetes.io/name: cloudpulse
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: cloudpulse-platform
    app.kubernetes.io/version: "v1.0.1"
spec:
  replicas: 2
  revisionHistoryLimit: 5          # Keep old ReplicaSets for rollback
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudpulse
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0            # Zero-downtime: never drop below desired replicas
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudpulse
        app.kubernetes.io/component: web
      annotations:
        # Tell Prometheus to scrape this pod's /metrics endpoint
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false   # App doesn't call the K8s API, so no token needed
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudpulse
          image: cloudpulse:v1.0.1
          imagePullPolicy: IfNotPresent    # Use the image loaded into Minikube
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: cloudpulse-config
          env:
            # Downward API: inject the pod's own IP into the app
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12           # Allow up to 60s for startup
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # Container filesystem is read-only
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Gunicorn needs a writable temp dir, so mount an in-memory volume
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
