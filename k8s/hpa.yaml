# Autoscale CloudPulse between 2 and 6 pods based on CPU usage
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudpulse
  namespace: cloudpulse
  labels:
    app.kubernetes.io/name: cloudpulse
    app.kubernetes.io/part-of: cloudpulse-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudpulse
  minReplicas: 2          # Always keep 2 pods for high availability
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60   # Scale up when average CPU > 60% of requests
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0      # React to spikes immediately
    scaleDown:
      stabilizationWindowSeconds: 120    # Wait 2 min before removing pods (avoid flapping)
