# Stable internal endpoint that load-balances traffic across CloudPulse pods
apiVersion: v1
kind: Service
metadata:
  name: cloudpulse
  namespace: cloudpulse
  labels:
    app.kubernetes.io/name: cloudpulse
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: cloudpulse-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloudpulse
  ports:
    - name: http
      port: 80
      targetPort: http
