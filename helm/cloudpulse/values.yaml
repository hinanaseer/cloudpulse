# Default values for the CloudPulse chart.
# Override per environment with: helm install ... -f values-prod.yaml

replicaCount: 2

image:
  repository: cloudpulse
  # Empty tag means the chart's appVersion is used
  tag: ""
  pullPolicy: IfNotPresent

# App settings rendered into the ConfigMap
config:
  appName: "CloudPulse"
  appEnv: "kubernetes"

service:
  type: ClusterIP
  port: 80

containerPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
  scaleDownStabilizationSeconds: 120

# Pod-level security (required by Pod Security Standard "restricted")
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# Container-level security hardening
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Add Prometheus scrape annotations to pods
metrics:
  enabled: true
  path: /metrics
